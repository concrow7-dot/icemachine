name: Check pull request

# Runs on every pull request (into main, or into release when publishing): the type check and build, the unit tests, and the browser
# test suites in headless Chromium, so problems show up as a red X before anyone tests by
# hand. Known flaky checks (tests/e2e/flaky.json) don't turn it red.
on:
  pull_request:
    branches: [main, release]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/run.mjs --retry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/e2e/.shots
          retention-days: 7
